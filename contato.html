<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container-fluid">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Navegação</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link active" aria-current="page" href="index.html">Principal</a>
                        <a class="nav-link" href="#">Pets</a>
                        <a class="nav-link" href="#">Doações</a>
                        <a class="nav-link" href="contato.html">Contato</a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- formulario d contato -->
        <div class="container">
            <div class="col-10 mx-auto">
                <form class="row g-3">
                    <div class="col-md-6">
                        <label for="inputNome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="inputNome">
                    </div>
                    <div class="col-md-6">
                        <label for="inputSobrenome" class="form-label">Sobrenome</label>
                        <input type="text" class="form-control" id="inputSobrenome">
                    </div>
                    <div class="col-12">
                        <label for="inputEnd" class="form-label">Endereço</label>
                        <input type="text" class="form-control" id="inputEnd" placeholder="Endereço">
                    </div>
                    <div class="col-12">
                        <label for="inputComplemento" class="form-label">Complemento</label>
                        <input type="text" class="form-control" id="inputComplemento"
                            placeholder="Apartmento, studio, quadra">
                    </div>
                    <div class="col-md-6">
                        <label for="inputCidade" class="form-label">Cidade</label>
                        <input type="text" class="form-control" id="inputCidade">
                    </div>
                    <div class="col-md-4">
                        <label for="inputEstado" class="form-label">Estado</label>
                        <select id="inputEstado" class="form-select">
                            <option selected>MT</option>
                            <option>MS</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="inputCep" class="form-label">CEP</label>
                        <input type="text" class="form-control" id="inputCep">
                    </div>
                
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
        <!-- fim do formulário -->

        <footer class="bg-light p-2 mt-2 text-center">
            &copy; Todos os direitos reservados
        </footer>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
